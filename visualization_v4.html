        // Helper function to safely parse float
        function safeParseFloat(value) {
            const parsed = parseFloat(value);
            return isNaN(parsed) ? 0 : parsed;
        }

        // Function to create diagnosis distribution chart
        function createDiagnosisChart(data) {
            const diagnosisCounts = {};
            data.forEach(patient => {
                if (patient.Diagnosis) {
                    diagnosisCounts[patient.Diagnosis] = (diagnosisCounts[patient.Diagnosis] || 0) + 1;
                }
            });

            const ctx = document.getElementById('diagnosisChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(diagnosisCounts),
                    datasets: [{
                        data: Object.values(diagnosisCounts),
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Distribution of Diagnoses' }
                    }
                }
            });
        }

        // Function to create age distribution chart
        function createAgeDistributionChart(data) {
            const ageRanges = ['50-59', '60-69', '70-79', '80+'];
            const ageCounts = [0, 0, 0, 0];

            data.forEach(patient => {
                const age = safeParseFloat(patient.Age);
                if (age >= 50 && age < 60) ageCounts[0]++;
                else if (age >= 60 && age < 70) ageCounts[1]++;
                else if (age >= 70 && age < 80) ageCounts[2]++;
                else if (age >= 80) ageCounts[3]++;
            });

            const ctx = document.getElementById('ageDistributionChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ageRanges,
                    datasets: [{
                        label: 'Number of Patients',
                        data: ageCounts,
                        backgroundColor: '#36A2EB'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Age Distribution of Patients' }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Number of Patients' } },
                        x: { title: { display: true, text: 'Age Range' } }
                    }
                }
            });
        }

        // Function to create treatment efficacy chart
        function createTreatmentEfficacyChart(data) {
            const efficacyData = {};
            data.forEach(patient => {
                if (patient.Diagnosis && patient.P11) {
                    if (!efficacyData[patient.Diagnosis]) {
                        efficacyData[patient.Diagnosis] = [];
                    }
                    efficacyData[patient.Diagnosis].push(safeParseFloat(patient.P11));
                }
            });

            const labels = Object.keys(efficacyData);
            const datasets = [
                {
                    label: 'Average Efficacy',
                    data: labels.map(diagnosis => 
                        efficacyData[diagnosis].reduce((a, b) => a + b, 0) / efficacyData[diagnosis].length
                    ),
                    backgroundColor: '#36A2EB'
                },
                {
                    label: 'Max Efficacy',
                    data: labels.map(diagnosis => Math.max(...efficacyData[diagnosis])),
                    backgroundColor: '#FF6384'
                },
                {
                    label: 'Min Efficacy',
                    data: labels.map(diagnosis => Math.min(...efficacyData[diagnosis])),
                    backgroundColor: '#FFCE56'
                }
            ];

            const ctx = document.getElementById('treatmentEfficacyChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Treatment Efficacy by Diagnosis' }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Efficacy' } },
                        x: { title: { display: true, text: 'Diagnosis' } }
                    }
                }
            });
        }

        // Function to create light intensity comparison chart
        function createLightIntensityChart(data) {
            const intensityData = {};
            const validKeys = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6'];
            const colors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];

            data.forEach(patient => {
                if (patient.Diagnosis) {
                    if (!intensityData[patient.Diagnosis]) {
                        intensityData[patient.Diagnosis] = { P1: 0, P2: 0, P3: 0, P4: 0, P5: 0, P6: 0, count: 0 };
                    }
                    validKeys.forEach(key => {
                        const value = safeParseFloat(patient[key]);
                        if (value !== 0) {
                            intensityData[patient.Diagnosis][key] += value;
                            intensityData[patient.Diagnosis].count++;
                        }
                    });
                }
            });

            const labels = Object.keys(intensityData);
            const datasets = validKeys.map((key, index) => ({
                label: key,
                data: labels.map(diagnosis => 
                    intensityData[diagnosis].count > 0 
                        ? intensityData[diagnosis][key] / intensityData[diagnosis].count 
                        : 0
                ),
                borderColor: colors[index],
                backgroundColor: colors[index],
                fill: false
            }));

            const ctx = document.getElementById('lightIntensityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Average Light Intensity by Diagnosis' }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Average Intensity' } },
                        x: { title: { display: true, text: 'Diagnosis' } }
                    }
                }
            });
        }

        // Function to create correlation chart
        function createCorrelationChart(data) {
            const ctx = document.getElementById('correlationChart').getContext('2d');
            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: Object.keys(data.reduce((acc, patient) => {
                        if (patient.Diagnosis) {
                            acc[patient.Diagnosis] = true;
                        }
                        return acc;
                    }, {})).map((diagnosis, index) => ({
                        label: diagnosis,
                        data: data.filter(patient => patient.Diagnosis === diagnosis).map(patient => ({
                            x: safeParseFloat(patient.Age),
                            y: safeParseFloat(patient.P11)
                        })).filter(point => point.x > 0 && point.y > 0),
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'][index % 5]
                    }))
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Age vs Treatment Efficacy' }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Age' } },
                        y: { title: { display: true, text: 'Treatment Efficacy' } }
                    }
                }
            });
        }

        // Function to create data table
        function createDataTable(data) {
            const table = document.getElementById('dataTable');
            const headers = Object.keys(data[0] || {});
            
            let headerRow = '<tr>' + headers.map(header => `<th>${header}</th>`).join('') + '</tr>';
            table.innerHTML = headerRow;

            data.forEach(patient => {
                let row = '<tr>' + headers.map(header => `<td>${patient[header] || ''}</td>`).join('') + '</tr>';
                table.innerHTML += row;
            });
        }

                // Function to calculate correlation coefficient
                function correlationCoefficient(x, y) {
            const n = x.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
            for (let i = 0; i < n; i++) {
                sumX += x[i];
                sumY += y[i];
                sumXY += x[i] * y[i];
                sumX2 += x[i] * x[i];
                sumY2 += y[i] * y[i];
            }
            const numerator = n * sumXY - sumX * sumY;
            const denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
            return denominator === 0 ? 0 : numerator / denominator;
        }

        // Function to create correlation matrix
        function createCorrelationMatrix(data) {
            const numericKeys = ['Age', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P11'];
            const correlationData = [];

            for (let i = 0; i < numericKeys.length; i++) {
                for (let j = 0; j < numericKeys.length; j++) {
                    const x = data.map(d => safeParseFloat(d[numericKeys[i]]));
                    const y = data.map(d => safeParseFloat(d[numericKeys[j]]));
                    const correlation = correlationCoefficient(x, y);
                    correlationData.push({
                        x: j,
                        y: i,
                        v: correlation
                    });
                }
            }

            const ctx = document.getElementById('correlationMatrix').getContext('2d');
            new Chart(ctx, {
                type: 'matrix',
                data: {
                    datasets: [{
                        label: 'Correlation Matrix',
                        data: correlationData,
                        backgroundColor(context) {
                            const value = context.dataset.data[context.dataIndex].v;
                            const alpha = Math.abs(value);
                            return value > 0
                                ? `rgba(0, 0, 255, ${alpha})`
                                : `rgba(255, 0, 0, ${alpha})`;
                        },
                        borderColor(context) {
                            return 'white';
                        },
                        borderWidth: 1,
                        width: ({ chart }) => (chart.chartArea || {}).width / numericKeys.length - 1,
                        height: ({ chart }) => (chart.chartArea || {}).height / numericKeys.length - 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title() {
                                    return '';
                                },
                                label(context) {
                                    const v = context.dataset.data[context.dataIndex];
                                    return [
                                        `${numericKeys[v.y]} vs ${numericKeys[v.x]}`,
                                        `Correlation: ${v.v.toFixed(2)}`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                callback: (value) => numericKeys[value]
                            },
                            title: {
                                display: true,
                                text: 'Variables'
                            }
                        },
                        y: {
                            ticks: {
                                callback: (value) => numericKeys[value]
                            },
                            title: {
                                display: true,
                                text: 'Variables'
                            },
                            reverse: true
                        }
                    }
                }
            });
        }

        // Main function to create all visualizations
        function createVisualizations(data) {
            createDiagnosisChart(data);
            createAgeDistributionChart(data);
            createTreatmentEfficacyChart(data);
            createLightIntensityChart(data);
            createCorrelationChart(data);
            createCorrelationMatrix(data);
            createDataTable(data);
        }

        // Run the main function when the page loads
        window.onload = () => createVisualizations(jsonData);
    </script>
